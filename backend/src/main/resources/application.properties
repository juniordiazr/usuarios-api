server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# El esquema se crea con schema.sql (script de creación de BD)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Regex de contraseña (configurable): 3-12 caracteres, al menos una minúscula y un número
app.security.password-regex=^(?=.*[0-9])(?=.*[a-z]).{3,12}$
# Regex de correo: ej. aaaaaaa@dominio.cl
app.validation.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$

# JWT (el secreto debe tener al menos 32 caracteres; en producción usar variable de entorno JWT_SECRET)
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-propio-de-32-o-mas-caracteres}
app.jwt.expiration-minutes=60

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
